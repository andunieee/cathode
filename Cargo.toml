[package]
name = "lumpla"
version = "0.1.0"
authors = ["George V <andunie@cassis.cash>"]
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
libmpv2 = "6"
libloading = "0.8"
libc = "0.2"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "sync", "process", "io-util", "macros", "time"] }
dirs = "7.0.0"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tar = "0.4.46"
liblzma = "0.4.9"
getrandom = "0.4"


[package.metadata.deb]
name = "lumpla"
section = "video"
priority = "optional"
depends = "$auto"
extended-description = "Searches YouTube, downloads videos with yt-dlp and plays them in a built-in mpv player."
assets = [
    ["target/release/lumpla", "usr/bin/", "755"],
    ["packaging/io.github.andunieee.Lumpla.desktop", "usr/share/applications/", "644"],
    ["packaging/io.github.andunieee.Lumpla.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/io.github.andunieee.Lumpla.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "lumpla"
summary = "A YouTube client built on yt-dlp and mpv"
assets = [
    { source = "target/release/lumpla", dest = "/usr/bin/lumpla", mode = "755" },
    { source = "packaging/io.github.andunieee.Lumpla.desktop", dest = "/usr/share/applications/io.github.andunieee.Lumpla.desktop", mode = "644" },
    { source = "packaging/io.github.andunieee.Lumpla.metainfo.xml", dest = "/usr/share/metainfo/io.github.andunieee.Lumpla.metainfo.xml", mode = "644" },
    { source = "assets/io.github.andunieee.Lumpla.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.andunieee.Lumpla.svg", mode = "644" },
]

[package.metadata.generate-rpm.requires]
gtk4 = ">= 4.10"
libadwaita = ">= 1.7"
mpv-libs = "*"
