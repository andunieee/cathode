[package]
name = "lumpla"
version = "0.1.0"
authors = ["George V <andunie@cassis.cash>"]
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
libmpv2 = "6"
libloading = "0.8"
libc = "0.2"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "sync", "process", "io-util", "macros", "time"] }
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
