app-id: io.github.andunieee.Cathode
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cathode
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # browsers' cookie databases (for yt-dlp's cookies-from-browser) live under $HOME
  - --filesystem=home
  # the keyring, to decrypt the cookies of Chromium-based browsers
  - --talk-name=org.freedesktop.secrets
modules:
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dtests=false
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --enable-gnutls
      - --disable-doc
      - --disable-programs
      - --disable-encoders
      - --disable-muxers
      - --enable-encoder=png
      - --enable-libdav1d
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/ffmpeg/examples
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
        sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e

  - name: libass
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - /lib/*.la
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc

  # Only libmpv: the player lives inside Cathode's own window.
  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dalsa=disabled
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Drubberband=disabled
      - -Duchardet=disabled
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/doc
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  - name: cathode
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/cathode/cargo
        # libmpv is installed in /app/lib; cc does not search it by default
        LIBRARY_PATH: /app/lib
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/cathode -t /app/bin
      - install -Dm644 packaging/io.github.andunieee.Cathode.desktop -t /app/share/applications
      - install -Dm644 packaging/io.github.andunieee.Cathode.metainfo.xml -t /app/share/metainfo
      - install -Dm644 assets/io.github.andunieee.Cathode.svg -t /app/share/icons/hicolor/scalable/apps
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - .flatpak-builder
          - build-dir
          - repo
          - packaging/flatpak/cargo-sources.json
      - cargo-sources.json
