name: Release

# Build portable release bundles when a "v" tag is pushed:
#   linux   : x86_64 .tar.gz (plain binary), portable .AppImage, .deb (Debian 13+),
#             .rpm (Fedora, needs RPM Fusion's mpv-libs) and a .flatpak bundle
#   windows : x86_64 .zip   (UCRT64 GTK4 + libmpv runtime, launch via cathode.bat)
#   macos   : arm64  .zip   (cathode.app with bundled Homebrew libraries)
# then updates the Homebrew cask and the cathode-bin AUR package.
#
# GTK4 cannot be linked statically upstream, so every bundle simply ships
# all runtime libraries next to the binary. yt-dlp is not bundled: the app
# fetches it at runtime.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # libadwaita >= 1.7 is required (adw::WrapBox), which Ubuntu 24.04 (1.5) doesn't have,
  # so the Linux builds run in Debian 13 (libadwaita 1.7, glibc 2.41).
  linux:
    name: linux (x86_64)
    runs-on: ubuntu-24.04
    container: debian:trixie
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1" # let linuxdeploy run without FUSE
      DEPLOY_GTK_VERSION: "4" # gtk plugin: bundle GTK4, not GTK3
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git wget file xz-utils patchelf desktop-file-utils \
            build-essential cmake pkg-config dpkg-dev \
            libgtk-4-dev libadwaita-1-dev libmpv-dev \
            librsvg2-dev librsvg2-bin libssl-dev

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Check the tag matches Cargo.toml
        run: |
          [ "${GITHUB_REF_TYPE}" = tag ] || exit 0
          crate="$(cargo metadata --no-deps --format-version 1 | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' | head -1)"
          [ "v${crate}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml version ${crate}"; exit 1; }

      - name: Build
        run: cargo build --release --locked

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/cathode-linux-x86_64-${TAG}.tar.gz" -C target/release cathode

          cargo deb --no-build --output "dist/cathode-linux-amd64-${TAG}.deb"

          mkdir -p AppDir/usr/bin \
            AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/256x256/apps
          install -m0755 target/release/cathode AppDir/usr/bin/cathode
          install -m0644 packaging/io.github.andunieee.Cathode.desktop AppDir/usr/share/applications/
          rsvg-convert -w 256 -h 256 assets/io.github.andunieee.Cathode.svg \
            -o AppDir/usr/share/icons/hicolor/256x256/apps/io.github.andunieee.Cathode.png

          wget -qc https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -qc https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          wget -qc https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          wget -qc https://raw.githubusercontent.com/AppImageCommunity/pkg2appimage/master/excludelist
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh appimagetool-x86_64.AppImage

          # linuxdeploy copies the binary plus all (transitively) linked
          # shared libraries into AppDir/usr/lib and rewrites their RUNPATHs;
          # the gtk plugin adds themes, glib schemas, pixbuf loaders, IMs etc.
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            -e AppDir/usr/bin/cathode \
            -d AppDir/usr/share/applications/io.github.andunieee.Cathode.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/io.github.andunieee.Cathode.png \
            --plugin gtk \
            --exclude-library 'libEGL.so*' \
            --exclude-library 'libGL.so*'

          # libpipewire-0.3 and libjack are on the excludelist but not on every host:
          # ship them (with what they need that isn't bundled or excluded) aside, for
          # the fallback-libs hook to use only when the host has none.
          excluded="$(grep -v -e '^#' -e '^$' excludelist | sed 's/[[:space:]].*//')"
          for lib in libpipewire-0.3.so.0 libjack.so.0; do
            dir="AppDir/usr/lib/fallback/$lib"
            mkdir -p "$dir"
            cp -L "/usr/lib/x86_64-linux-gnu/$lib" "$dir/"
            ldd "$dir/$lib" | awk '$2 == "=>" && $3 ~ /^\// {print $1, $3}' | while read -r name path; do
              [ -e "AppDir/usr/lib/$name" ] || printf '%s\n' "$excluded" | grep -qxF "$name" || cp -L "$path" "$dir/"
            done
            patchelf --set-rpath '$ORIGIN:$ORIGIN/../..' "$dir"/*
          done
          ls -lR AppDir/usr/lib/fallback
          # Without --output, linuxdeploy leaves AppRun a symlink to the binary: write the
          # wrapper that sources the hooks (the gtk plugin's and ours) as it would.
          install -m0644 packaging/appimage/fallback-libs.sh AppDir/apprun-hooks/
          rm AppDir/AppRun
          ln -sf usr/bin/cathode AppDir/AppRun.wrapped
          {
            printf '#! /usr/bin/env bash\n\nset -e\n\nthis_dir="$(readlink -f "$(dirname "$0")")"\n\n'
            for hook in AppDir/apprun-hooks/*.sh; do
              printf 'source "$this_dir"/apprun-hooks/"%s"\n' "${hook##*/}"
            done
            printf '\nexec "$this_dir"/AppRun.wrapped "$@"\n'
          } > AppDir/AppRun
          chmod 0755 AppDir/AppRun
          cat AppDir/AppRun
          grep -q linuxdeploy-plugin-gtk.sh AppDir/AppRun

          # AppImage names don't say "linux": they all are.
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir "dist/cathode-${TAG}-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  # RPM Fusion carries libmpv on Fedora (the official repositories have no mpv).
  rpm:
    name: rpm (x86_64)
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"
          dnf install -y git tar gzip curl gcc gcc-c++ cmake pkgconf-pkg-config rpm-build \
            gtk4-devel libadwaita-devel mpv-devel openssl-devel

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate-rpm

      - name: Build
        run: cargo build --release --locked

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          strip target/release/cathode
          mkdir -p dist
          cargo generate-rpm --output "dist/cathode-linux-x86_64-${TAG}.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/

  flatpak-sources:
    name: flatpak (cargo sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate the offline cargo sources
        run: |
          pip install aiohttp tomlkit
          curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-sources
          path: packaging/flatpak/cargo-sources.json

  flatpak:
    name: flatpak (x86_64)
    needs: flatpak-sources
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-sources
          path: packaging/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: cathode-linux-x86_64-${{ github.ref_name }}.flatpak
          manifest-path: packaging/flatpak/io.github.andunieee.Cathode.yml
          cache-key: flatpak-builder-${{ github.sha }}
          arch: x86_64
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: cathode-linux-x86_64-${{ github.ref_name }}.flatpak

  macos:
    name: macos (arm64)
    # Apple Silicon only: Intel runners and Homebrew Intel bottles were
    # retired/disabled in 2026, and x86_64 runners end in 2027 anyway.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install gtk4 libadwaita mpv librsvg

      - name: Build
        run: |
          # rustc doesn't search Homebrew's prefix, libmpv2-sys just asks for -lmpv.
          export LIBRARY_PATH="$(brew --prefix)/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          cargo build --release --locked

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          APP="cathode.app"
          MACOS_DIR="$APP/Contents/MacOS"
          RES_DIR="$APP/Contents/Resources"
          LIBDIR="$MACOS_DIR/lib"
          mkdir -p "$LIBDIR" "$RES_DIR/share" "$RES_DIR/lib/gdk-pixbuf-2.0/2.10.0/loaders"

          cp target/release/cathode "$MACOS_DIR/cathode-bin"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>io.github.andunieee.Cathode</string>
            <key>CFBundleName</key><string>Cathode</string>
            <key>CFBundleExecutable</key><string>cathode</string>
            <key>CFBundleIconFile</key><string>Cathode</string>
            <key>LSMinimumSystemVersion</key><string>15.0</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # Finder strips DYLD_* env vars, so all libraries are resolved with
          # @executable_path rpaths baked into the binary and every dylib.
          BREW="$(brew --prefix)"

          # 1. copy every Homebrew dylib, recursively via otool.
          collect() {
            local abs name dst
            abs="$1"
            case "$abs" in
              /usr/lib/*|/System/*|@*) return ;;
            esac
            name="$(basename "$abs")"
            dst="$LIBDIR/$name"
            [ -e "$dst" ] && return 0
            cp "$abs" "$dst"
            chmod u+w "$dst"
            while read -r dep; do
              collect "$dep"
            done < <(otool -L "$abs" | awk 'NR>1{print $1}' | sed "s|^@rpath|$BREW/lib|")
          }
          otool -L "$MACOS_DIR/cathode-bin" | awk 'NR>1{print $1}' | sed "s|^@rpath|$BREW/lib|" | while read -r dep; do
            collect "$dep"
          done

          # gdk-pixbuf loaders (PNG/SVG icons...) are dlopen()ed, so they are not in otool's
          # output: copy them with their dependencies and keep them next to the other libraries.
          PIXBUF="$RES_DIR/lib/gdk-pixbuf-2.0/2.10.0/loaders"
          cp "$BREW"/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.so "$PIXBUF/"
          chmod u+w "$PIXBUF"/*.so
          for loader in "$PIXBUF"/*.so; do
            while read -r dep; do
              collect "$dep"
            done < <(otool -L "$loader" | awk 'NR>1{print $1}' | sed "s|^@rpath|$BREW/lib|")
          done

          # 2. rewrite every reference to point into the bundle.
          rewrite() {
            while read -r dep; do
              case "$dep" in
                /usr/lib/*|/System/*|@executable_path/*) continue ;;
              esac
              install_name_tool -change "$dep" "@executable_path/lib/$(basename "$dep")" "$1"
            done < <(otool -L "$1" | awk 'NR>1{print $1}')
          }
          rewrite "$MACOS_DIR/cathode-bin"
          for lib in "$LIBDIR"/* "$PIXBUF"/*.so; do
            install_name_tool -id "@executable_path/lib/$(basename "$lib")" "$lib" 2>/dev/null || true
            rewrite "$lib"
          done

          # 3. Data GTK looks up at runtime: compiled glib schemas and the icon themes.
          mkdir -p "$RES_DIR/share/glib-2.0/schemas" "$RES_DIR/share/icons"
          cp "$BREW"/share/glib-2.0/schemas/*.xml "$RES_DIR/share/glib-2.0/schemas/"
          glib-compile-schemas "$RES_DIR/share/glib-2.0/schemas"
          for theme in Adwaita hicolor; do
            [ -d "$BREW/share/icons/$theme" ] && cp -R "$BREW/share/icons/$theme" "$RES_DIR/share/icons/"
          done

          # The loaders cache lists absolute paths, so it is written on each launch.
          # It is queried from Homebrew's own loaders: the bundled copies point at
          # @executable_path/lib, which gdk-pixbuf-query-loaders can't dlopen
          # (that left the cache empty, without even the SVG loader).
          BREW_PIXBUF="$BREW/lib/gdk-pixbuf-2.0/2.10.0/loaders"
          GDK_PIXBUF_MODULEDIR="$BREW_PIXBUF" "$BREW/bin/gdk-pixbuf-query-loaders" "$BREW_PIXBUF"/*.so \
            | sed "s|$BREW_PIXBUF|@RES@/lib/gdk-pixbuf-2.0/2.10.0/loaders|" > "$RES_DIR/loaders.cache.in"
          grep -q '@RES@/lib/gdk-pixbuf-2.0/2.10.0/loaders/libpixbufloader_svg.so' "$RES_DIR/loaders.cache.in" \
            || { echo "the pixbuf loaders cache has no SVG loader"; cat "$RES_DIR/loaders.cache.in"; exit 1; }

          # 4. App icon.
          ICONSET="$(mktemp -d)/Cathode.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            rsvg-convert -w "$size" -h "$size" assets/io.github.andunieee.Cathode.svg -o "$ICONSET/icon_${size}x${size}.png"
            rsvg-convert -w "$((size * 2))" -h "$((size * 2))" assets/io.github.andunieee.Cathode.svg -o "$ICONSET/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$ICONSET" -o "$RES_DIR/Cathode.icns"

          cat > "$MACOS_DIR/cathode" <<'EOF'
          #!/bin/bash
          HERE="$(cd "$(dirname "$0")" && pwd)"
          RES="$(cd "$HERE/../Resources" && pwd)"
          CACHE="${TMPDIR:-/tmp}/cathode-pixbuf-$(id -u).cache"
          sed "s|@RES@|$RES|g" "$RES/loaders.cache.in" > "$CACHE"
          export GDK_PIXBUF_MODULE_FILE="$CACHE"
          export XDG_DATA_DIRS="$RES/share${XDG_DATA_DIRS:+:$XDG_DATA_DIRS}"
          export GSETTINGS_SCHEMA_DIR="$RES/share/glib-2.0/schemas"
          exec "$HERE/cathode-bin" "$@"
          EOF
          chmod +x "$MACOS_DIR/cathode"

          # install_name_tool invalidated every ad-hoc signature; on Apple
          # Silicon unsigned/modded binaries get killed on load, so re-sign
          # everything ad-hoc (`-` = no Apple Developer identity needed).
          find "$APP" -name '*.dylib' | while read -r f; do codesign --force --sign - "$f"; done
          codesign --force --sign - "$MACOS_DIR/cathode-bin"

          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/cathode-macos-arm64-${TAG}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  windows:
    name: windows (x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          release: false
          install: >-
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ntldd

      - name: Build
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="/ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cargo build --release --locked

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # Bundle layout mirrors an msys2 install prefix; on Windows glib
          # resolves glib/gtk resource dirs *relative to the DLL location*,
          # so putting DLLs in bundle/bin and resources under bundle/share
          # and bundle/lib makes the tree relocatable without env tricks.
          mkdir -p bundle/bin \
            bundle/share/glib-2.0/schemas \
            bundle/share/icons \
            bundle/lib/gdk-pixbuf-2.0/2.10.0/loaders

          cp target/release/cathode.exe bundle/bin/

          cp /ucrt64/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll bundle/lib/gdk-pixbuf-2.0/2.10.0/loaders/

          # Copy every dependency DLL (recursively via ntldd) of the binary and
          # of the dlopen()ed pixbuf loaders, skipping the Windows system ones
          # that are already present on any machine. ntldd prints Windows paths
          # ("D:\a\_temp\msys64\ucrt64\bin\foo.dll", runner root varies), so the
          # backslashes are turned into slashes before matching.
          ntldd -R bundle/bin/cathode.exe bundle/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll \
            | tr -s '[:space:]' '\n' | tr '\\' '/' | while read -r tok; do
            case "$tok" in
              /ucrt64/*|?:/*)
                unix="$(cygpath -u "$tok")"
                case "$unix" in
                  */ucrt64/bin/*.dll)
                    [ -e "bundle/bin/$(basename "$unix")" ] || cp "$unix" bundle/bin/ ;;
                esac ;;
            esac
          done

          # Fail here rather than ship a bundle that can't start.
          for dll in libgtk-4-1.dll libadwaita-1-0.dll libcairo-2.dll libcairo-gobject-2.dll \
            libgdk_pixbuf-2.0-0.dll libglib-2.0-0.dll libmpv-2.dll; do
            [ -e "bundle/bin/$dll" ] || { echo "missing $dll in the bundle"; exit 1; }
          done

          # glib schemas (compiled), icon theme, pixbuf loaders cache.
          cp /ucrt64/share/glib-2.0/schemas/*.xz bundle/share/glib-2.0/schemas/ 2>/dev/null || true
          cp -r /ucrt64/share/glib-2.0/schemas/gschemas.compiled bundle/share/glib-2.0/schemas/
          cp -r /ucrt64/share/icons/hicolor bundle/share/icons/
          # The app icon by name (About page, window icon).
          mkdir -p bundle/share/icons/hicolor/scalable/apps
          cp assets/io.github.andunieee.Cathode.svg bundle/share/icons/hicolor/scalable/apps/
          (cd bundle && gdk-pixbuf-query-loaders lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll \
            > lib/gdk-pixbuf-2.0/2.10.0/loaders.cache)

          # CRLF batch wrapper (Finder-style entry point, LF breaks cmd.exe).
          printf '@echo off\r\nset GDK_PIXBUF_MODULE_FILE=%%~dp0lib\\gdk-pixbuf-2.0\\2.10.0\\loaders.cache\r\nstart "" "%%~dp0bin\\cathode.exe" %%*\r\n' > bundle/cathode.bat

          mkdir -p dist
          # The installer: Start menu entry, uninstaller and the cathode:// handler.
          # Inno Setup comes with the runner image.
          # MSYS would rewrite the /D switches as POSIX paths, so skip its argument conversion.
          MSYS2_ARG_CONV_EXCL='*' "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DVersion=${VERSION}" "/DBundle=$(cygpath -w "$PWD/bundle")" "/DOutput=$(cygpath -w "$PWD/dist")" \
            "$(cygpath -w "$PWD/packaging/windows/cathode.iss")"
          powershell -NoProfile -Command "Compress-Archive -Force -Path bundle/* -DestinationPath 'dist/cathode-windows-x64-v${VERSION}.zip'"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  release:
    needs: [linux, rpm, flatpak, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          FLAT=$(mktemp -d); NOTES=$(mktemp); cp -v -r dist/*/* "$FLAT"/; rm -f "$NOTES"
          cat > "$NOTES" <<'EOF'
          Portable bundles — all runtime libraries included (GTK4 cannot be linked statically upstream).

          - **linux**: `.flatpak` (`flatpak install cathode-*.flatpak`), `.deb` (Debian 13+, Ubuntu 25.04+), `.rpm` (Fedora, needs [RPM Fusion](https://rpmfusion.org) for `mpv-libs`), `.AppImage` (needs FUSE; run with `--appimage-extract-and-run` otherwise, and glibc 2.41+), or `.tar.gz` (requires system GTK4 4.10+/libadwaita 1.7+/libmpv).
          - **macos**: Apple Silicon (arm64) only, unsigned — first launch: right-click > Open, or `xattr -d com.apple.quarantine cathode.app`.
          - **windows**: run the `-setup-` installer, or extract the `.zip` and run `cathode.bat`.
          yt-dlp is managed by the app at runtime, not bundled.
          EOF
          gh release create "$TAG" --verify-tag --generate-notes --notes-file "$NOTES"
          gh release upload "$TAG" "$FLAT"/* --clobber

  # Rewrites the cask in the andunieee/homebrew-cathode tap. Needs a TAP_TOKEN secret: a
  # fine-grained PAT with contents write access to that repo.
  homebrew:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: andunieee/homebrew-cathode
          token: ${{ secrets.TAP_TOKEN }}

      - name: Update the cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "cathode-macos-arm64-*.zip" --dir zip
          SHA=$(sha256sum zip/*.zip | cut -d' ' -f1)
          mkdir -p Casks
          cat > Casks/cathode.rb <<RUBY
          cask "cathode" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/andunieee/cathode/releases/download/v#{version}/cathode-macos-arm64-v#{version}.zip"
            name "Cathode"
            desc "YouTube client for the desktop"
            homepage "https://github.com/andunieee/cathode"

            depends_on arch: :arm64

            app "cathode.app"

            # the app is unsigned, so clear the quarantine flag instead of making users do it
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/cathode.app"]
            end

            zap trash: [
              "~/Library/Application Support/cathode",
              "~/Library/Caches/cathode",
            ]
          end
          RUBY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/cathode.rb
          git commit -m "cathode ${VERSION}" || exit 0
          git push

  # Pushes an updated PKGBUILD for cathode-bin to the AUR, repackaging the release .deb.
  # The action regenerates .SRCINFO in an Arch container and pushes via SSH. Needs an
  # AUR_SSH_PRIVATE_KEY secret whose public key is added to the AUR account.
  aur:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Stage the PKGBUILD
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          curl -fsSL -o cathode.deb \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}/cathode-linux-amd64-${TAG}.deb"
          SHA=$(sha256sum cathode.deb | cut -d' ' -f1)
          mkdir -p aur
          cat > aur/PKGBUILD <<PKGEOF
          # Maintainer: George V <andunie@cassis.cash>
          pkgname=cathode-bin
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="YouTube client for the desktop, built on yt-dlp and mpv"
          arch=('x86_64')
          url="https://github.com/andunieee/cathode"
          license=('GPL-3.0-only')
          provides=('cathode')
          conflicts=('cathode')
          depends=('gtk4' 'libadwaita' 'mpv')
          source=("cathode-\${pkgver}.deb::https://github.com/andunieee/cathode/releases/download/v\${pkgver}/cathode-linux-amd64-v\${pkgver}.deb")
          sha256sums=('${SHA}')

          package() {
            # the .deb already lays out /usr/bin, the .desktop, the metainfo and the icon
            bsdtar -xf "\${srcdir}/data.tar."* -C "\${pkgdir}"
          }
          PKGEOF
          cat aur/PKGBUILD

      - name: Publish to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: cathode-bin
          pkgbuild: aur/PKGBUILD
          commit_username: George V
          commit_email: andunie@cassis.cash
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "upgpkg: cathode-bin ${{ github.ref_name }}-1"
