name: Release

# Build portable release bundles when a "v" tag is pushed:
#   linux   : x86_64 .tar.gz (plain binary) + portable .AppImage
#   windows : x86_64 .zip   (UCRT64 GTK4 + libmpv runtime, launch via lumpla.bat)
#   macos   : arm64  .zip   (lumpla.app with bundled Homebrew libraries)
#
# GTK4 cannot be linked statically upstream, so every bundle simply ships
# all runtime libraries next to the binary. yt-dlp is not bundled: the app
# fetches it at runtime.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: linux (x86_64)
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1" # let linuxdeploy run without FUSE
      DEPLOY_GTK_VERSION: "4" # gtk plugin: bundle GTK4, not GTK3
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libmpv-dev \
            librsvg2-dev libssl-dev \
            imagemagick

      - name: Build
        run: cargo build --release --locked

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"

          mkdir -p dist
          tar -czf "dist/lumpla-linux-x86_64-${TAG}.tar.gz" -C target/release lumpla

          # Minimal desktop entry + icon; linuxdeploy requires both.
          mkdir -p AppDir/usr/bin \
            AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/256x256/apps
          install -m0755 target/release/lumpla AppDir/usr/bin/lumpla
          cat > AppDir/usr/share/applications/lumpla.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Lumpla
          Exec=lumpla
          Icon=lumpla
          Categories=AudioVideo;Video;Player;
          EOF
          convert assets/demo.jpg -resize 256x256 \
            AppDir/usr/share/icons/hicolor/256x256/apps/lumpla.png

          wget -qc https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -qc https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

          # linuxdeploy copies the binary plus all (transitively) linked
          # shared libraries into AppDir/usr/lib and rewrites their RUNPATHs;
          # the gtk plugin adds themes, glib schemas, pixbuf loaders, IMs etc.
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            -e AppDir/usr/bin/lumpla \
            -d AppDir/usr/share/applications/lumpla.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/lumpla.png \
            --plugin gtk \
            --output appimage \
            --exclude-library 'libEGL.so*' \
            --exclude-library 'libGL.so*'

          mv Lumpla-*.AppImage "dist/lumpla-linux-x86_64-${TAG}.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  macos:
    name: macos (arm64)
    # Apple Silicon only: Intel runners and Homebrew Intel bottles were
    # retired/disabled in 2026, and x86_64 runners end in 2027 anyway.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install gtk4 libadwaita mpv

      - name: Build
        run: cargo build --release --locked

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          APP="lumpla.app"
          MACOS_DIR="$APP/Contents/MacOS"
          RES_DIR="$APP/Contents/Resources"
          LIBDIR="$MACOS_DIR/lib"
          mkdir -p "$MACOS_DIR/lib" "$RES_DIR/lib"

          cp target/release/lumpla "$MACOS_DIR/lumpla-bin"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>cash.cassis.lumpla</string>
            <key>CFBundleName</key><string>Lumpla</string>
            <key>CFBundleExecutable</key><string>lumpla</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # Finder strips DYLD_* env vars, so all libraries are resolved with
          # @executable_path rpaths baked into the binary and every dylib.
          # (GL proc lookup is Linux-only in src/player.rs — macOS video
          # rendering needs a platform loader added there later.)
          BREW="$(brew --prefix)"

          # 1. copy every Homebrew dylib, recursively via otool.
          collect() {
            local abs name dst
            abs="$1"
            case "$abs" in
              /usr/lib/*|/System/*|@*) return ;;
            esac
            name="$(basename "$abs")"
            dst="$LIBDIR/$name"
            [ -e "$dst" ] && return 0
            cp "$abs" "$dst"
            chmod u+w "$dst"
            while read -r dep; do
              collect "$dep"
            done < <(otool -L "$abs" | awk 'NR>1{print $1}' | sed "s|^@rpath|$BREW/lib|")
          }
          otool -L "$MACOS_DIR/lumpla-bin" | awk 'NR>1{print $1}' | sed "s|^@rpath|$BREW/lib|" | while read -r dep; do
            collect "$dep"
          done

          # 2. rewrite every reference to point into the bundle.
          rewrite() {
            while read -r dep; do
              case "$dep" in
                /usr/lib/*|/System/*|@executable_path/*) continue ;;
              esac
              install_name_tool -change "$dep" "@executable_path/lib/$(basename "$dep")" "$1"
            done < <(otool -L "$1" | awk 'NR>1{print $1}')
          }
          rewrite "$MACOS_DIR/lumpla-bin"
          for lib in "$LIBDIR"/*; do
            install_name_tool -id "@executable_path/lib/$(basename "$lib")" "$lib" 2>/dev/null || true
            rewrite "$lib"
          done

          # 3. GObject introspection typelibs (GTK-4, Adw-1, GLib, ...).
          cp "$BREW"/lib/girepository-1.0/*.typelib "$RES_DIR/lib/girepository-1.0/"

          cat > "$MACOS_DIR/lumpla" <<'EOF'
          #!/bin/bash
          HERE="$(cd "$(dirname "$0")" && pwd)"
          RES="$(cd "$HERE/../Resources" && pwd)"
          export GI_TYPELIB_PATH="$RES/lib/girepository-1.0${GI_TYPELIB_PATH:+:$GI_TYPELIB_PATH}"
          exec "$HERE/lumpla-bin" "$@"
          EOF
          chmod +x "$MACOS_DIR/lumpla"

          # install_name_tool invalidated every ad-hoc signature; on Apple
          # Silicon unsigned/modded binaries get killed on load, so re-sign
          # everything ad-hoc (`-` = no Apple Developer identity needed).
          find "$APP" -name '*.dylib' | while read -r f; do codesign --force --sign - "$f"; done
          codesign --force --sign - "$MACOS_DIR/lumpla-bin"

          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/lumpla-macos-arm64-${TAG}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  windows:
    name: windows (x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          release: false
          install: >-
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-cargo
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ntldd

      - name: Build
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="/ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cargo build --release --locked

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # Bundle layout mirrors an msys2 install prefix; on Windows glib
          # resolves glib/gtk resource dirs *relative to the DLL location*,
          # so putting DLLs in bundle/bin and resources under bundle/share
          # and bundle/lib makes the tree relocatable without env tricks.
          mkdir -p bundle/bin \
            bundle/share/glib-2.0/schemas \
            bundle/share/icons \
            bundle/lib/gdk-pixbuf-2.0/2.10.0/loaders

          cp target/release/lumpla.exe bundle/bin/

          # Copy every dependency DLL (recursively via ntldd), skipping the
          # Windows system ones that are already present on any machine.
          ntldd -R bundle/bin/lumpla.exe | tr -s '[:space:]' '\n' | while read -r tok; do
            case "$tok" in
              /ucrt64/*|?:/*)
                # Direct POSIX path or "D:/msys64/ucrt64/…" (runner root varies).
                unix="$(cygpath -u "${tok//\\//}")"
                case "$unix" in *ucrt64/bin/*) cp -n "$unix" bundle/bin/ ;; esac ;;
            esac
          done

          # glib schemas (compiled), icon theme, pixbuf loaders + cache.
          cp /ucrt64/share/glib-2.0/schemas/*.xz bundle/share/glib-2.0/schemas/ 2>/dev/null || true
          cp -r /ucrt64/share/glib-2.0/schemas/gschemas.compiled bundle/share/glib-2.0/schemas/
          cp -r /ucrt64/share/icons/hicolor bundle/share/icons/
          cp /ucrt64/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll bundle/lib/gdk-pixbuf-2.0/2.10.0/loaders/
          (cd bundle && gdk-pixbuf-query-loaders "lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll" \
            > lib/gdk-pixbuf-2.0/2.10.0/loaders.cache)

          # CRLF batch wrapper (Finder-style entry point, LF breaks cmd.exe).
          printf '@echo off\r\nset GDK_PIXBUF_MODULE_FILE=%%~dp0lib\\gdk-pixbuf-2.0\\2.10.0\\loaders.cache\r\nstart "" "%%~dp0bin\\lumpla.exe" %%*\r\n' > bundle/lumpla.bat

          mkdir -p dist
          powershell -NoProfile -Command "Compress-Archive -Force -Path bundle/* -DestinationPath 'dist/lumpla-windows-x64-v${VERSION}.zip'"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  release:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          FLAT=$(mktemp -d); NOTES=$(mktemp); cp -v -r dist/*/* "$FLAT"/; rm -f "$NOTES"
          cat > "$NOTES" <<'EOF'
          Portable bundles — all runtime libraries included (GTK4 cannot be linked statically upstream).

          - **linux**: `.AppImage` (needs FUSE; run with `--appimage-extract-and-run` otherwise) or `.tar.gz` (requires system GTK4/libadwaita/libmpv).
          - **macos**: Apple Silicon (arm64) only, unsigned — first launch: right-click > Open, or `xattr -d com.apple.quarantine lumpla.app`.
          - **windows**: extract, run `lumpla.bat`.
          yt-dlp is managed by the app at runtime, not bundled.
          EOF
          gh release create "$TAG" --verify-tag --generate-notes --notes-file "$NOTES"
          gh release upload "$TAG" "$FLAT"/* --clobber
